    owner: developer-platform
    status: planned_for_P00-W02
  - id: worker
    path: backend/cmd/worker
    runtime: Go
    owner: jobs
    status: planned_for_P00-W02
  - id: scheduler
    path: backend/cmd/scheduler
    runtime: Go
    owner: operations
    status: planned_for_P00-W02
  - id: admin-web
    path: web/admin
    runtime: Vue 3
    owner: admin
    status: planned_for_P00-W05
