name: contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/12_REGENERATE_CONTRACTS.py
      - run: git diff --exit-code -- contracts
      - run: python scripts/07_VALIDATE_CONTRACTS.py
      - run: python scripts/13_VALIDATE_PACKAGE.py --repository-mode
