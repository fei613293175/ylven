schema_version: 1.3.0
required_outputs:
- AUTOMATED_TEST_REPORT.md
- VISUAL_DIFF_REPORT.md
- CI_PROVENANCE.json
- BUILD_INFO.json
- FEATURES_ORIGINAL.md
- FEATURE_COMPLETION_COMPARISON.md
- OWNER_TEST_CHECKLIST.md
- FEATURES_PLANNED.md
- FEATURES_COMPLETED.md
- DEPLOYMENT_ENDPOINTS.md
- DOMAIN_DNS_STATUS.md
- OWNER_ACTIONS.md
- OWNER_ACCEPTANCE.md
- SHA256SUMS.txt
apk_rules:
  exactly_one: true
  minimum_bytes: 1048576
  must_be_exact_github_actions_artifact: true
  must_contain:
  - AndroidManifest.xml
  - classes.dex
completion_rules:
- All current-phase Feature IDs have a final status and individual comparison row.
- Original features, completion comparison and owner test checklist pass script 47.
- Automated tests and the exact GitHub Actions commit are captured in provenance.
- Deployment, public health, rollback and known limitations are explicit.
- SHA256SUMS.txt validates every immutable release file.
ui_rules:
  design_system_version: YL-DS-1.2.0
  ci_runtime_screenshots_required: true
  blank_or_duplicate_screenshots_forbidden: true
  unexplained_visual_diff_forbidden: true
