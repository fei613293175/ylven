schema_version: 2.0.0
owner_delivery_contract: contracts/owner-delivery-contract.yaml
required_outputs:
- 自动化测试报告.md
- 视觉差异报告.md
- 服务器构建来源证明.json
- 本机下载校验证明.json
- 真机验收证据.json
- 真机日志审查.md
- 真实页面截图索引.csv
- 真实页面视觉审查.json
- 构建信息.json
- 原功能清单.md
- 功能完成对比清单.md
- 完整测试清单.md
- 计划功能清单.md
- 已完成功能清单.md
- 部署证据.md
- 覆盖安装证据.md
- 域名DNS状态.md
- 管理后台实测证据.md
- 所有者操作项.md
- 所有者验收.md
- 截图索引.csv
- 校验文件_SHA256.txt
apk_rules:
  exactly_one: true
  minimum_bytes: 1048576
  must_be_exact_online_server_artifact: true
  local_rebuild_forbidden: true
  server_and_download_sha256_must_match: true
  physical_device_acceptance_required: true
  must_contain:
  - AndroidManifest.xml
  - classes.dex
completion_rules:
- All current-phase Feature IDs have a final status and individual comparison row.
- 原功能清单、功能完成对比清单、完整测试清单逐 Feature 通过脚本 47。
- Automated tests, exact Git commit, online-server build provenance and local download verification are captured.
- Physical-device identity, FIFO lock, ADB device state, upgrade install, launch, interaction path, screenshots and log review are captured.
- Every current-phase Android page is exercised with real click/input/back/scroll behavior, every defined state has a physical-device screenshot, and Codex directly reviews screenshots captured from the production YlvenApp path.
- Real staging business flows are separate from deterministic Fake gateway UI tests and both must pass where applicable.
- 部署证据、公开健康检查、回滚和已知限制必须明确。
- 校验文件_SHA256.txt 必须校验每个不可变交付文件。
- 每个 P00-P13 版本必须完成真实管理后台打开、登录、当前版本功能操作、真实数据回读和审计证据。
- 覆盖安装失败、崩溃、ANR、日志异常、视觉失败、后台不可访问、功能不可用或证据缺失均禁止交付。
forbidden:
  github_actions: true
  android_emulator: true
  every_other_simulator: true
brand_assets:
  logo: android/app/src/main/res/drawable/ylven_logo.png
  splash: android/app/src/main/res/drawable-nodpi/ylven_splash.png
  application_id: cc.orbexa.ylven
  fixed_signing_certificate: true
upgrade_install:
  required: true
  method: adb install -r
  clear_data_forbidden: true
  login_state_and_data_migration_required: true
  approved_signing_migrations:
    P03:
      approval_file: contracts/signing-migrations/P03.properties
      install_mode: one_time_uninstall_then_install
      data_preserved: false
      future_upgrade_baseline: P03
admin_real_test:
  required_for_every_phase: true
  evidence_file: 管理后台实测证据.md
  real_public_url_and_api_data_required: true
  static_or_mock_success_forbidden: true
ui_rules:
  design_system_version: YL-DS-1.2.0
  physical_device_runtime_screenshots_required: true
  production_app_path_screenshots_required: true
  direct_codex_production_page_review_required: true
  blank_or_duplicate_screenshots_forbidden: true
  unexplained_visual_diff_forbidden: true
