server {
    listen 80;
    server_name ai-admin.orbexa.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/ai-admin.orbexa.cc;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ai-admin.orbexa.cc;

    root /www/wwwroot/ai-admin.orbexa.cc/current;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    ssl_certificate /opt/ylven-letsencrypt/live/ai-admin.orbexa.cc/fullchain.pem;
    ssl_certificate_key /opt/ylven-letsencrypt/live/ai-admin.orbexa.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:28201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ^~ /admin/v1/ {
        proxy_pass http://127.0.0.1:28201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location ^~ /internal/v1/ {
        proxy_pass http://127.0.0.1:28201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location = /internal/metrics { return 404; }
    location ~ ^/(health|health/ready|healthz|readyz|version)$ {
        proxy_pass http://127.0.0.1:28201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    access_log /www/wwwlogs/ai-admin.orbexa.cc.log;
    error_log /www/wwwlogs/ai-admin.orbexa.cc.error.log;
}
