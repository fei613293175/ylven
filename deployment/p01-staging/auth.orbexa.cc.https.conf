server {
    listen 80;
    server_name auth.orbexa.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.orbexa.cc;

    ssl_certificate /opt/ylven-letsencrypt/live/auth.orbexa.cc/fullchain.pem;
    ssl_certificate_key /opt/ylven-letsencrypt/live/auth.orbexa.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /security/turnstile {
        proxy_pass http://127.0.0.1:28201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location = /internal/v1/security/turnstile/verify {
        proxy_pass http://127.0.0.1:28201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:28201;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }

    access_log /www/wwwlogs/auth.orbexa.cc.log;
    error_log /www/wwwlogs/auth.orbexa.cc.error.log;
}
