schema_version: '1.0'
authority: CANONICAL
principle: 多写代码、多产出真实成果，少做重复检查和无边界思考
rules:
- 每个 Work Packet 只允许一次完整前置检查；同一输入未变化时不得重复运行全仓库审计。
- 开发中使用相关模块测试；完整真机、全量视觉和发布检查每个 owner-facing 版本只运行一次主流程，失败后只重跑受影响部分。禁止使用 GitHub Actions、Android Emulator 或任何模拟器。
- 连续两个工作循环没有代码、测试、契约或可运行成果时，必须停止泛化分析，输出具体阻塞并继续其他不受阻任务。
- 普通 UI 或局部功能不重复执行 Spec Kit 全流程；每阶段只规划一次，工作包直接实现。
- 禁止为了证明遵守规则而反复生成内容重复的报告；机器检查结果写入同一个可更新报告。
- 实现优先级：可运行代码 > 自动测试 > 必需合同 > 必需说明；不得用长篇计划替代实现。
verification_budget:
  preflight_per_packet: 1
  full_audit_per_owner_release: 1
  targeted_test_during_implementation: true
  no_code_loop_limit: 2
