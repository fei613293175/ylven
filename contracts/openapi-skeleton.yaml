components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    YlvenApiKey:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          - retryable
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
  responses:
    BadRequest:
      description: Invalid request
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required
      content: *id001
    Forbidden:
      description: Permission denied
      content: *id001
    Conflict:
      description: State or idempotency conflict
      content: *id001
    RateLimited:
      description: Rate limit exceeded
      content: *id001
    InternalError:
      description: Internal error
      content: *id001
