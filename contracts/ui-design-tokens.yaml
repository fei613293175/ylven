content_and_function_policy:
- Visual mockups define layout, styling, hierarchy and visible states only.
- Functional behavior, permissions, billing, data and navigation come only from Feature IDs and development contracts.
- Sample names, amounts, dates, models, files and messages in mockups are non-production sample data.
- A visible control without an Interaction ID is decorative or disabled; Codex must not invent a click action.
- A required Feature ID not visible in the current mockup still must be implemented; request a visual-contract update instead
  of omitting it.
- No screen may introduce an uncontracted feature because it appears in a mockup.
