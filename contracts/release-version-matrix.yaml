schema_version: '1.0'
authority: CANONICAL
package_version: 1.6.0
repository:
  url: https://github.com/fei613293175/ylven.git
  remote: origin
  default_branch: main
  application_id: cc.orbexa.ylven
versioning:
  version_name_formula: 1.<phase_index>.0
  version_code_formula: major*1000000 + minor*10000 + patch*100 + build_sequence
  owner_release_build_sequence: 0
  upgrade_install_required: true
  fixed_application_id: cc.orbexa.ylven
  fixed_signing_certificate_required: true
approved_signing_migrations:
  P03:
    approval_file: contracts/signing-migrations/P03.properties
    install_mode: one_time_uninstall_then_install
    data_preserved: false
    establishes_fixed_signing_baseline_for: P03-P13
global_release_requirements:
  applies_to_every_phase: true
  build_pipeline: online_server_exact_commit
  acceptance_device: owner_physical_android_phone
  github_actions_forbidden: true
  emulators_and_simulators_forbidden: true
  server_artifact_sha256_download_verification_required: true
  physical_device_fifo_queue_required: true
  logo_resource: android/app/src/main/res/drawable/ylven_logo.png
  splash_resource: android/app/src/main/res/drawable-nodpi/ylven_splash.png
  overlay_install:
    command: adb install -r
    clear_data_forbidden: true
    same_application_id_required: true
    same_signing_certificate_required: true
    data_and_login_state_migration_required: true
  chinese_delivery_files:
    original_features: 原功能清单.md
    completion_comparison: 功能完成对比清单.md
    complete_test_checklist: 完整测试清单.md
    deployment_evidence: 部署证据.md
    upgrade_evidence: 覆盖安装证据.md
    screenshots: 截图
    screenshot_index: 截图索引.csv
    production_screenshot_index: 真实页面截图索引.csv
    production_visual_review: 真实页面视觉审查.json
    checksum: 校验文件_SHA256.txt
  admin_real_test:
    codex_must_open_every_version: true
    current_phase_features_must_be_real_and_complete: true
    public_url_and_real_api_data_required: true
    evidence: 管理后台实测证据.md
