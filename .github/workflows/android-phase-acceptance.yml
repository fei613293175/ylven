name: Android Phase Acceptance

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Release phase, for example P03"
        required: true
        type: string
      version:
        description: "Expected versionName, for example 1.3.0"
        required: true
        type: string
      commit_sha:
        description: "Exact source commit SHA"
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches:
      - "phase/**"

permissions:
  contents: read
  checks: write

concurrency:
  group: ylven-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  ANDROID_API_LEVEL: "35"

jobs:
  backend-process-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Test P00 runtime process boundaries
        working-directory: backend
        run: go test ./...

  contracts-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package validation tools
        run: python -m pip install --disable-pip-version-check PyYAML Pillow
      - name: Validate canonical contracts and interaction test coverage
        run: |
          python scripts/07_VALIDATE_CONTRACTS.py
          python scripts/38_VALIDATE_STATE_CONTINUITY.py
          python scripts/40_PUBLIC_REPOSITORY_SAFETY.py
          python scripts/19_VALIDATE_UI_CONTRACTS.py
          python scripts/26_VALIDATE_GENERATED_MOCKUPS.py
          python scripts/31_VALIDATE_INTERACTION_TEST_COVERAGE.py
          python scripts/32_VERIFY_ANDROID_VERSION_CONTRACT.py --phase "${{ inputs.phase || 'AUTO' }}" --version "${{ inputs.version || 'AUTO' }}"

  android-emulator-acceptance:
    needs: contracts-and-schema
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Android acceptance validation tools
        run: python -m pip install --disable-pip-version-check -r requirements-tools.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build, unit test and lint
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug
      - name: Grant Android emulator access to KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run fixed Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/29_RUN_ANDROID_PHASE_ACCEPTANCE.sh "${{ inputs.phase || 'AUTO' }}" "${{ inputs.version || 'AUTO' }}"
      - name: Verify exact acceptance artifact
        run: python scripts/33_VERIFY_ANDROID_ACCEPTANCE_OUTPUT.py --phase "${{ inputs.phase || 'AUTO' }}" --version "${{ inputs.version || 'AUTO' }}" --commit "${GITHUB_SHA}"
      - name: Upload exact acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: ylven-${{ inputs.phase || 'auto' }}-${{ inputs.version || 'auto' }}-${{ github.sha }}-android-acceptance
          path: build/owner-release/
          if-no-files-found: error
          retention-days: 30
