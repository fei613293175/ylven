name: Android Phase Acceptance

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Release phase, for example P03"
        required: true
        type: string
      version:
        description: "Expected versionName, for example 1.3.0"
        required: true
        type: string
      commit_sha:
        description: "Exact source commit SHA"
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches:
      - "phase/**"

permissions:
  contents: read
  checks: write

concurrency:
  group: ylven-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  ANDROID_API_LEVEL: "35"

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.release.outputs.phase }}
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release-version validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - id: release
        name: Resolve the source phase and release version
        shell: bash
        run: |
          set -euo pipefail
          requested_phase="${{ inputs.phase || '' }}"
          requested_version="${{ inputs.version || '' }}"
          requested_commit="${{ inputs.commit_sha || '' }}"

          if [[ -n "$requested_commit" && "$requested_commit" != "$GITHUB_SHA" ]]; then
            echo "workflow_dispatch commit_sha must equal the checked-out GitHub SHA" >&2
            exit 1
          fi

          if [[ -n "$requested_phase" ]]; then
            phase="${requested_phase^^}"
          else
            phase=$(sed -nE "s/^[[:space:]]*(phase_id|current_phase):[[:space:]]*['\"]?([[:alnum:]_-]+).*/\2/p" CURRENT_PHASE.yaml | head -n 1 | tr '[:lower:]' '[:upper:]')
          fi
          if [[ -z "$phase" ]]; then
            echo "could not resolve the current release phase" >&2
            exit 1
          fi

          if [[ -n "$requested_version" ]]; then
            version="$requested_version"
          else
            version=$(python scripts/32_VERIFY_ANDROID_VERSION_CONTRACT.py --phase "$phase" --print-version)
          fi
          python scripts/32_VERIFY_ANDROID_VERSION_CONTRACT.py --phase "$phase" --version "$version"

          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  web-shell-tests:
    needs: resolve-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, developer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package.json
      - name: Install and test ${{ matrix.app }} shell
        working-directory: web/${{ matrix.app }}
        run: npm install --no-audit --no-fund && npm test && npm run build

  backend-process-tests:
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Test P00 runtime process boundaries
        working-directory: backend
        run: go test ./...

  contracts-and-schema:
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package validation tools
        run: python -m pip install --disable-pip-version-check PyYAML Pillow
      - name: Validate canonical contracts and interaction test coverage
        run: |
          python scripts/07_VALIDATE_CONTRACTS.py
          python scripts/38_VALIDATE_STATE_CONTINUITY.py
          python scripts/41_SELF_TEST_STATE_CONTINUITY.py
          python scripts/40_PUBLIC_REPOSITORY_SAFETY.py
          python scripts/43_VERIFY_OPENAPI_DRIFT.py
          python scripts/44_VALIDATE_P00_TRACEABILITY.py
          python scripts/45_VALIDATE_SECRET_BOUNDARY.py
          python scripts/46_SELF_TEST_DESKTOP_DELIVERY.py
          python scripts/47_VALIDATE_OWNER_DELIVERY_MANIFEST.py --phase "${{ needs.resolve-release.outputs.phase }}" --version "${{ needs.resolve-release.outputs.version }}"
          python scripts/19_VALIDATE_UI_CONTRACTS.py
          python scripts/26_VALIDATE_GENERATED_MOCKUPS.py
          python scripts/31_VALIDATE_INTERACTION_TEST_COVERAGE.py
          python scripts/32_VERIFY_ANDROID_VERSION_CONTRACT.py --phase "${{ needs.resolve-release.outputs.phase }}" --version "${{ needs.resolve-release.outputs.version }}"
          python tests/p02_release_visual_guard_test.py

  android-emulator-acceptance:
    needs: [contracts-and-schema, resolve-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Android acceptance validation tools
        run: python -m pip install --disable-pip-version-check -r requirements-tools.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build, unit test and lint
        run: ./gradlew --no-daemon -PylvenVersionName="${{ needs.resolve-release.outputs.version }}" -PylvenApiBaseUrl="https://ai-admin.orbexa.cc" -PylvenStagingTurnstileToken="test-pass" clean testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin
      - name: Grant Android emulator access to KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run fixed Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            UPGRADE_FROM=$(python scripts/32_VERIFY_ANDROID_VERSION_CONTRACT.py --phase "${{ needs.resolve-release.outputs.phase }}" --print-upgrade-from | tail -n 1)
            bash scripts/29_RUN_ANDROID_PHASE_ACCEPTANCE.sh "${{ needs.resolve-release.outputs.phase }}" "${{ needs.resolve-release.outputs.version }}" "$UPGRADE_FROM"
      - name: Verify exact acceptance artifact
        run: python scripts/33_VERIFY_ANDROID_ACCEPTANCE_OUTPUT.py --phase "${{ needs.resolve-release.outputs.phase }}" --version "${{ needs.resolve-release.outputs.version }}" --commit "${{ needs.resolve-release.outputs.commit_sha }}"
      - name: Upload failed Android acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ylven-${{ needs.resolve-release.outputs.phase }}-${{ needs.resolve-release.outputs.version }}-${{ github.sha }}-failed-diagnostics
          path: build/owner-release/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload exact acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: ylven-${{ needs.resolve-release.outputs.phase }}-${{ needs.resolve-release.outputs.version }}-${{ github.sha }}-android-acceptance
          path: build/owner-release/
          if-no-files-found: error
          retention-days: 30
