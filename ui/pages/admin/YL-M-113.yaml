binding_rules:
  visual_implementation_gate: Every listed state must have an APPROVED mockup with matching SHA-256 before Codex finalizes
    this page.
  visual_authority: Approved mockup + this resolved numeric contract.
  functional_authority: contracts/feature-map.yaml and the listed Feature IDs.
  no_invention: Text or controls shown only as sample content do not create a feature. No unlisted action may be implemented.
  identity_rule: A Page ID must not reuse another Page ID body. Overlay and component contracts must render their own focal
    surface and reference their parent page explicitly.
  conflict_rule: Numeric token contract wins over estimated measurements; functional contract wins over mockup sample content;
    conflicts require an ADR and updated mockup.
